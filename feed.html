<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Linework Feed</title>
  <meta name="description" content="Drawings people made on Linework, and the records their lines picked.">
  <meta name="theme-color" content="#f3efe6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app feed-app">
    <header class="top">
      <h1 class="wordmark"><a href="./">Line<em>work</em></a></h1>
      <div class="top-actions">
        <a class="feed-link about-link" href="about.html">About</a>
        <a class="feed-link" href="./">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20c3-1 4-4 7-9s5-6 9-7"/></svg>
          <span>Draw</span>
        </a>
      </div>
    </header>

    <div class="feed-head">
      <h2>The feed</h2>
      <p class="feed-sub" id="feedSub">Drawings, and the records their lines picked.</p>
    </div>

    <ol class="feed" id="feed" aria-live="polite"></ol>
    <button class="submit ghost" id="more" hidden>Show more</button>

    <div class="feed-empty" id="empty" hidden>
      <p>No drawings yet.</p>
      <a class="submit" href="./">Draw the first one</a>
    </div>

    <div class="tip-wrap">
      <a class="submit ghost tip-jar" href="https://paypal.me/12Atlanta?country.x=US&amp;locale.x=en_US" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9h12l-1.2 10.2a2 2 0 0 1-2 1.8H9.2a2 2 0 0 1-2-1.8L6 9Z"/><path d="M5 9h14M9 9V6.5a3 3 0 0 1 6 0V9"/><path d="M12 12.5v5M10.3 14.2h3.4"/></svg>
        <span>Tip Jar</span>
      </a>
      <p class="small muted tip-note">Opens PayPal. Tips are optional and help keep Linework running.</p>
    </div>
  </div>
  <script type="module" src="js/feed.js"></script>
</body>
</html>
